<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="용돈 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>용돈 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Page reset (the Claude viewer supplied this before). */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one phone-width column. Balance on top, then the savings goal, the entry form, spending by category, and the 용돈기입장 table with a running balance. */
:root {
  --bg: #eef6f3;
  --surface: #ffffff;
  --surface-2: #e2efea;
  --ink: #133331;
  --muted: #587471;
  --line: #cfe2dd;
  --in: #0b7a55;
  --on-in: #ffffff;
  --out: #c23b22;
  --on-out: #ffffff;
  --coin: #f6b91a;
  --coin-ink: #3a2a00;
  --coin-edge: #c48f00;
  --coin-soft: #fff1c9;
  --track: #f1dca0;
  --hero-bg: #123c38;
  --hero-fg: #ffc93c;
  --hero-sub: #a9cfc8;
  --hero-in: #7be3b8;
  --hero-out: #ffb3a1;
  --focus: #2563eb;
  --font-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --fs-s: 0.8125rem;
  --fs-b: 1rem;
  --fs-l: 1.125rem;
  --fs-xl: 1.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1c1b;
    --surface: #162927;
    --surface-2: #1f3a37;
    --ink: #e6f3f0;
    --muted: #93b0ab;
    --line: #2a4542;
    --in: #4fd1a0;
    --on-in: #06261b;
    --out: #ff8a70;
    --on-out: #3a0f06;
    --coin-edge: #a07400;
    --coin-soft: #3a3010;
    --track: #554717;
    --hero-bg: #1c443f;
    --focus: #7aa7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1c1b;
  --surface: #162927;
  --surface-2: #1f3a37;
  --ink: #e6f3f0;
  --muted: #93b0ab;
  --line: #2a4542;
  --in: #4fd1a0;
  --on-in: #06261b;
  --out: #ff8a70;
  --on-out: #3a0f06;
  --coin-edge: #a07400;
  --coin-soft: #3a3010;
  --track: #554717;
  --hero-bg: #1c443f;
  --focus: #7aa7ff;
  color-scheme: dark;
}

/* Skins: green is the default (no data-skin). Each skin re-tints the ground, ink, lines and the balance card, in light and dark. */
:root[data-skin="pink"] { --bg: #fdf0f5; --surface-2: #f8dfe9; --ink: #3a1428; --muted: #85566d; --line: #f0cddc; --hero-bg: #8f2a5a; --hero-sub: #f6c3d9; }
:root[data-skin="purple"] { --bg: #f5f0fc; --surface-2: #e6dcf6; --ink: #261640; --muted: #6b5a8c; --line: #d9cdf0; --hero-bg: #4a2b8a; --hero-sub: #cdbcf2; }
:root[data-skin="blue"] { --bg: #eef5fd; --surface-2: #dce9f8; --ink: #12263f; --muted: #52698a; --line: #c9dbf0; --hero-bg: #1d4e9e; --hero-sub: #bcd5f5; }
@media (prefers-color-scheme: dark) {
  :root[data-skin="pink"]:not([data-theme="light"]) { --bg: #1c0d15; --surface: #2b1522; --surface-2: #3d2031; --ink: #fbe8f0; --muted: #cfa0b7; --line: #4d2a3d; --hero-bg: #6e2048; --hero-sub: #f0b8d0; }
  :root[data-skin="purple"]:not([data-theme="light"]) { --bg: #150e22; --surface: #211634; --surface-2: #31224d; --ink: #efe8fb; --muted: #b3a2d6; --line: #3d2d5e; --hero-bg: #3b2475; --hero-sub: #cbb9f0; }
  :root[data-skin="blue"]:not([data-theme="light"]) { --bg: #0c1624; --surface: #142338; --surface-2: #1e3452; --ink: #e6f0fc; --muted: #95b0d2; --line: #2a4568; --hero-bg: #1b4585; --hero-sub: #b5d0f3; }
}
:root[data-skin="pink"][data-theme="dark"] { --bg: #1c0d15; --surface: #2b1522; --surface-2: #3d2031; --ink: #fbe8f0; --muted: #cfa0b7; --line: #4d2a3d; --hero-bg: #6e2048; --hero-sub: #f0b8d0; }
:root[data-skin="purple"][data-theme="dark"] { --bg: #150e22; --surface: #211634; --surface-2: #31224d; --ink: #efe8fb; --muted: #b3a2d6; --line: #3d2d5e; --hero-bg: #3b2475; --hero-sub: #cbb9f0; }
:root[data-skin="blue"][data-theme="dark"] { --bg: #0c1624; --surface: #142338; --surface-2: #1e3452; --ink: #e6f0fc; --muted: #95b0d2; --line: #2a4568; --hero-bg: #1b4585; --hero-sub: #b5d0f3; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-b);
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 56px;
}
.app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, p { margin: 0; }
h1, h2, .display { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; text-wrap: balance; }
h1 { font-size: var(--fs-xl); line-height: 1.2; }
h2 { font-size: var(--fs-l); line-height: 1.3; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.top .sub { font-size: var(--fs-s); color: var(--muted); }
.today { font-size: var(--fs-s); color: var(--muted); font-weight: 500; }

.skins { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.skins .lab { margin-right: 2px; }
.skins-group { display: flex; gap: 10px; }
.skins-group label { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; display: block; }
.skins-group input:checked + label { outline: 3px solid var(--ink); outline-offset: 2px; }
.skins-group input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.sw-green { background: #123c38; }
.sw-pink { background: #c23d82; }
.sw-purple { background: #6a43c4; }
.sw-blue { background: #2f6fd0; }

.demo { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; background: var(--coin-soft); border: 2px dashed var(--coin-edge); border-radius: 12px; padding: 10px 12px; font-size: var(--fs-s); }
.demo p { min-width: 0; flex: 1 1 12rem; font-weight: 500; }

.hero { background: var(--hero-bg); color: var(--hero-sub); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero-label { font-size: var(--fs-s); font-weight: 500; }
.hero-num { font-family: var(--font-display); color: var(--hero-fg); font-size: clamp(2.5rem, 13vw, 3.5rem); line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-num small { font-size: 0.5em; margin-left: 4px; }
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.16); padding-top: 12px; }
.hero-stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hero-stats span { font-size: 0.75rem; }
.hero-stats b { font-size: var(--fs-l); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-stats .pos { color: var(--hero-in); }
.hero-stats .neg { color: var(--hero-out); }

.goal { background: var(--coin-soft); border: 1px solid var(--coin-edge); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.goal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.goal-top > div { min-width: 0; }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.goal h2 { overflow-wrap: anywhere; }
.bar { height: 16px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--coin); border-radius: 99px; box-shadow: inset 0 -3px 0 var(--coin-edge); min-width: 0; transition: width 0.4s ease; }
.goal-line { font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.goal-line b { color: var(--ink); font-size: var(--fs-b); }
.goal-msg { font-weight: 700; }
.goal-form { display: flex; flex-direction: column; gap: 10px; }
.goal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 14px; position: relative; }
.seg label { text-align: center; padding: 10px 8px; border-radius: 10px; font-family: var(--font-display); font-size: var(--fs-l); cursor: pointer; color: var(--muted); }
#t-in:checked + label { background: var(--in); color: var(--on-in); }
#t-out:checked + label { background: var(--out); color: var(--on-out); }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lab, .field > label { font-size: var(--fs-s); font-weight: 700; color: var(--muted); }
input[type="text"], input[type="date"] { font: inherit; width: 100%; min-width: 0; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
input[type="text"]:focus, input[type="date"]:focus { border-color: var(--focus); outline: none; }
#amt, #goalAmt { font-family: var(--font-display); font-size: 1.375rem; font-variant-numeric: tabular-nums; }
.row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { padding: 8px 14px; border: 2px solid var(--line); border-radius: 99px; font-weight: 500; cursor: pointer; }
.chips input:checked + label { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button, .ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: var(--fs-s); font-weight: 700; }
.quick button:hover, .ghost:hover { border-color: var(--muted); }
.ghost.sm { padding: 5px 10px; }
.msg { min-height: 1.5em; font-size: var(--fs-s); font-weight: 700; }
.msg.err { color: var(--out); }
.msg.warn { color: var(--out); }
.msg.ok { color: var(--in); }
.primary { width: 100%; border: 0; background: var(--coin); color: var(--coin-ink); font-family: var(--font-display); font-size: var(--fs-l); padding: 14px; border-radius: 14px; box-shadow: 0 4px 0 var(--coin-edge); transition: transform 0.08s; }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--coin-edge); }

.summary { display: flex; flex-direction: column; gap: 10px; }
.summary-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary-head span { font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.cats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cats li { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr) 5.2rem; align-items: center; gap: 10px; font-size: var(--fs-s); }
.cats .k { font-weight: 700; }
.cats .b { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.cats .b i { display: block; height: 100%; background: var(--out); border-radius: 99px; }
.cats .v { text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: var(--fs-s); color: var(--muted); }

.ledger { padding: 16px 12px; gap: 10px; }
.ledger-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-inline: 4px; }
.ledger-head span { font-size: var(--fs-s); color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 2px solid var(--line); }
td { padding: 10px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.num, td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.d { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
td.c { min-width: 5.5rem; word-break: keep-all; overflow-wrap: anywhere; }
td.in-cell { color: var(--in); font-weight: 700; }
td.out-cell { color: var(--out); font-weight: 700; }
td.bal { font-weight: 700; }
td.bal.neg { color: var(--out); }
.tag { display: inline-block; font-size: 0.6875rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); margin-right: 4px; }
.tag.in { color: var(--in); }
.tag.out { color: var(--out); }
.del { border: 0; background: none; color: var(--muted); font-size: 0.75rem; padding: 2px 4px; text-decoration: underline; }
.ask { font-weight: 700; margin-right: 4px; }
.ask-btn { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; margin-right: 4px; }
.ask-btn.yes { background: var(--out); color: var(--on-out); border-color: var(--out); }
.empty { text-align: center; padding: 20px 8px; color: var(--muted); }
.more { align-self: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <div>
      <h1>용돈 기록장</h1>
      <p class="sub" id="status"></p>
    </div>
    <p class="today" id="todayLabel"></p>
  </header>

  <div class="skins" role="radiogroup" aria-labelledby="skinLab">
    <span class="lab" id="skinLab">색깔 고르기</span>
    <div class="skins-group">
      <input class="sr" type="radio" name="skin" id="sk-green" value="green"><label for="sk-green" class="sw-green" title="초록" aria-label="초록"></label>
      <input class="sr" type="radio" name="skin" id="sk-pink" value="pink"><label for="sk-pink" class="sw-pink" title="핑크" aria-label="핑크"></label>
      <input class="sr" type="radio" name="skin" id="sk-purple" value="purple"><label for="sk-purple" class="sw-purple" title="보라" aria-label="보라"></label>
      <input class="sr" type="radio" name="skin" id="sk-blue" value="blue"><label for="sk-blue" class="sw-blue" title="파랑" aria-label="파랑"></label>
    </div>
  </div>

  <div class="demo" id="demo" hidden>
    <p>지금 보이는 기록과 목표는 예시예요. 내 기록을 시작하려면 예시를 지워 주세요.</p>
    <button type="button" class="ghost" data-act="clear-demo">예시 지우고 시작하기</button>
  </div>

  <section class="hero" aria-labelledby="balLabel">
    <p class="hero-label" id="balLabel">지금 내가 가진 돈</p>
    <p class="hero-num"><span id="bal">0</span><small>원</small></p>
    <div class="hero-stats">
      <div><span>최근 30일 받은 돈</span><b class="pos" id="sIn">0원</b></div>
      <div><span>최근 30일 쓴 돈</span><b class="neg" id="sOut">0원</b></div>
    </div>
  </section>

  <section class="goal" id="goal" aria-label="모으는 목표"></section>

  <form class="card" id="form" novalidate>
    <h2>기록하기</h2>
    <div class="seg" role="radiogroup" aria-label="받았나요, 썼나요?">
      <input class="sr" type="radio" name="type" id="t-in" value="in" checked>
      <label for="t-in">받았어요</label>
      <input class="sr" type="radio" name="type" id="t-out" value="out">
      <label for="t-out">썼어요</label>
    </div>
    <div class="field">
      <span class="lab" id="catLab">어떤 돈을 받았나요?</span>
      <div class="chips" id="cats" role="radiogroup" aria-labelledby="catLab"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="amt">금액 (원)</label>
        <input type="text" id="amt" inputmode="numeric" autocomplete="off" placeholder="예: 1,000">
      </div>
      <div class="field">
        <label for="date">날짜</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="quick" id="quick" aria-label="금액 더하기">
      <button type="button" data-add="500">+500</button>
      <button type="button" data-add="1000">+1,000</button>
      <button type="button" data-add="5000">+5,000</button>
      <button type="button" data-add="10000">+10,000</button>
      <button type="button" data-add="0">금액 지우기</button>
    </div>
    <div class="field">
      <label for="memo">메모 (안 써도 돼요)</label>
      <input type="text" id="memo" maxlength="30" autocomplete="off" placeholder="예: 이번 주 용돈">
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <button class="primary" id="submit" type="submit">받은 돈 기록하기</button>
  </form>

  <section class="summary" aria-labelledby="sumTitle">
    <div class="summary-head">
      <h2 id="sumTitle">최근 30일, 어디에 썼을까요?</h2>
      <span id="sumTotal"></span>
    </div>
    <ul class="cats" id="sumList"></ul>
  </section>

  <section class="card ledger" aria-labelledby="ledTitle">
    <div class="ledger-head">
      <h2 id="ledTitle">용돈기입장</h2>
      <span id="count"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>날짜</th><th>내용</th><th class="num">들어온 돈</th><th class="num">나간 돈</th><th class="num">남은 돈</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>아직 기록이 없어요. 위에서 첫 기록을 남겨 보세요.</p>
    <button type="button" class="ghost more" id="more" data-act="more" hidden>더 보기</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  var KEY = 'yongdon-book-v1';
  var CATS = { in: ['용돈', '심부름', '선물', '세뱃돈', '기타'], out: ['간식', '문구', '장난감', '게임', '선물', '기타'] };
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  var SKINS = ['green', 'pink', 'purple', 'blue'];
  var THEME_COLORS = { green: '#123c38', pink: '#8f2a5a', purple: '#4a2b8a', blue: '#1d4e9e' };
  var MAX_AMT = 99999999;
  var MAX_ENTRIES = 1500;

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var now = new Date();
  var todayStr = ymd(now);
  var recentFrom = ymd(addDays(now, -29));

  /* ---------- data ---------- */
  function demoState() {
    function d(n) { return ymd(addDays(now, -n)); }
    function e(n, type, cat, memo, amt, i) {
      return { id: 'demo' + i, date: d(n), type: type, cat: cat, memo: memo, amt: amt, ts: i, demo: true };
    }
    return {
      v: 1, rev: 0,
      entries: [
        e(20, 'in', '용돈', '이번 주 용돈', 5000, 1),
        e(18, 'out', '간식', '편의점 젤리', 1500, 2),
        e(14, 'in', '심부름', '설거지 도와드림', 1000, 3),
        e(13, 'out', '문구', '지우개와 스티커', 2000, 4),
        e(7, 'in', '용돈', '이번 주 용돈', 5000, 5),
        e(6, 'out', '간식', '떡볶이', 1200, 6),
        e(3, 'in', '선물', '할머니가 주셨어요', 3000, 7),
        e(2, 'out', '장난감', '팽이', 800, 8)
      ],
      goal: { name: '축구공', amt: 15000, demo: true }
    };
  }

  function sanitize(o) {
    var list = (o && Array.isArray(o.entries)) ? o.entries : [];
    var entries = list.filter(function (e) {
      return e && (e.type === 'in' || e.type === 'out') && Number.isFinite(e.amt) && e.amt > 0 && /^\d{4}-\d{2}-\d{2}$/.test(String(e.date));
    }).map(function (e) {
      return {
        id: String(e.id || uid()), date: String(e.date), type: e.type,
        cat: String(e.cat || '기타').slice(0, 10), memo: String(e.memo || '').slice(0, 30),
        amt: Math.min(Math.round(e.amt), MAX_AMT), ts: Number(e.ts) || 0, demo: !!e.demo
      };
    });
    var goal = null;
    if (o && o.goal && Number.isFinite(o.goal.amt) && o.goal.amt > 0 && o.goal.name) {
      goal = { name: String(o.goal.name).slice(0, 14), amt: Math.min(Math.round(o.goal.amt), MAX_AMT), demo: !!o.goal.demo };
    }
    var skin = (o && SKINS.indexOf(o.skin) > -1) ? o.skin : 'green';
    return { v: 1, rev: Number(o && o.rev) || 0, entries: entries, goal: goal, skin: skin };
  }

  function loadLocal() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) { var o = JSON.parse(s); if (o && Array.isArray(o.entries)) return o; }
    } catch (e) { /* storage unavailable */ }
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  var state = sanitize(loadLocal() || demoState());

  function rowsWithBalance(entries) {
    var a = entries.slice().sort(function (x, y) {
      if (x.date !== y.date) return x.date < y.date ? -1 : 1;
      return x.ts - y.ts;
    });
    var b = 0;
    return a.map(function (e) {
      b += e.type === 'in' ? e.amt : -e.amt;
      return Object.assign({}, e, { bal: b });
    });
  }
  function balance() {
    return state.entries.reduce(function (s, e) { return s + (e.type === 'in' ? e.amt : -e.amt); }, 0);
  }
  function recentStats() {
    var i = 0, o = 0;
    state.entries.forEach(function (e) {
      if (e.date >= recentFrom && e.date <= todayStr) { if (e.type === 'in') i += e.amt; else o += e.amt; }
    });
    return { i: i, o: o };
  }

  /* ---------- saving (this device) ---------- */
  function setStatus() { $('status').textContent = '기록이 이 기기에 저장돼요.'; }
  function persist() { state.rev = Date.now(); saveLocal(); }

  /* ---------- rendering ---------- */
  var shown = 30, pendingDel = null, goalEditing = false, warned = false, msgTimer = null;

  function renderDemo() {
    var has = state.entries.some(function (e) { return e.demo; }) || (state.goal && state.goal.demo);
    $('demo').hidden = !has;
  }

  function renderHero() {
    var b = balance();
    $('bal').textContent = fmt(b);
    var s = recentStats();
    $('sIn').textContent = '+' + fmt(s.i) + '원';
    $('sOut').textContent = '-' + fmt(s.o) + '원';
  }

  function renderGoal() {
    if (goalEditing) return;
    var el = $('goal');
    var g = state.goal;
    if (!g) {
      el.innerHTML = '<p class="eyebrow">모으는 목표</p>' +
        '<h2>사고 싶은 게 있나요?</h2>' +
        '<p class="goal-line">목표를 정하면 얼마를 더 모아야 하는지 알려 줘요.</p>' +
        '<div class="goal-actions"><button type="button" class="ghost" data-act="goal-edit">목표 정하기</button></div>';
      return;
    }
    var bal = balance();
    var pct = Math.max(0, Math.min(100, Math.round(bal / g.amt * 100)));
    var left = g.amt - bal;
    el.innerHTML =
      '<div class="goal-top"><div><p class="eyebrow">모으는 목표</p><h2>' + esc(g.name) + '</h2></div>' +
      '<button type="button" class="ghost sm" data-act="goal-edit">바꾸기</button></div>' +
      '<div class="bar" role="progressbar" aria-label="목표까지 모은 정도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<p class="goal-line"><b>' + fmt(Math.max(bal, 0)) + '원</b> / ' + fmt(g.amt) + '원 (' + pct + '%)</p>' +
      '<p class="goal-msg">' + (left > 0 ? fmt(left) + '원만 더 모으면 살 수 있어요.' : '목표를 이뤘어요! 이제 살 수 있어요.') + '</p>';
  }

  function openGoalForm() {
    goalEditing = true;
    var g = state.goal;
    $('goal').innerHTML =
      '<div class="goal-form">' +
      '<p class="eyebrow">모으는 목표</p>' +
      '<div class="field"><label for="goalName">사고 싶은 것</label>' +
      '<input type="text" id="goalName" maxlength="14" autocomplete="off" placeholder="예: 축구공" value="' + (g ? esc(g.name) : '') + '"></div>' +
      '<div class="field"><label for="goalAmt">얼마인가요? (원)</label>' +
      '<input type="text" id="goalAmt" inputmode="numeric" autocomplete="off" placeholder="예: 15,000" value="' + (g ? fmt(g.amt) : '') + '"></div>' +
      '<p class="msg" id="goalMsg" role="status" aria-live="polite"></p>' +
      '<div class="goal-actions">' +
      '<button type="button" class="ghost" data-act="goal-save">저장</button>' +
      '<button type="button" class="ghost" data-act="goal-cancel">취소</button>' +
      (g ? '<button type="button" class="ghost" data-act="goal-delete">목표 지우기</button>' : '') +
      '</div></div>';
    bindMoney($('goalAmt'));
    $('goalName').focus();
  }

  function renderSummary() {
    var sums = {}, total = 0;
    state.entries.forEach(function (e) {
      if (e.type === 'out' && e.date >= recentFrom && e.date <= todayStr) {
        sums[e.cat] = (sums[e.cat] || 0) + e.amt; total += e.amt;
      }
    });
    var keys = Object.keys(sums).sort(function (a, b) { return sums[b] - sums[a]; });
    var list = $('sumList');
    if (!keys.length) {
      list.innerHTML = '<li class="note" style="display:block">최근 30일 동안 쓴 돈이 없어요.</li>';
      $('sumTotal').textContent = '';
      return;
    }
    var max = sums[keys[0]];
    list.innerHTML = keys.map(function (k) {
      var w = Math.max(4, Math.round(sums[k] / max * 100));
      return '<li><span class="k">' + esc(k) + '</span><span class="b"><i style="width:' + w + '%"></i></span><span class="v">' + fmt(sums[k]) + '원</span></li>';
    }).join('');
    $('sumTotal').textContent = '모두 ' + fmt(total) + '원 썼어요';
  }

  function renderLedger() {
    var all = rowsWithBalance(state.entries).reverse();
    var part = all.slice(0, shown);
    $('empty').hidden = all.length > 0;
    $('more').hidden = all.length <= shown;
    $('count').textContent = all.length ? '기록 ' + all.length + '개' : '';
    $('rows').innerHTML = part.map(function (r) {
      var p = r.date.split('-');
      var dateTxt = Number(p[1]) + '/' + Number(p[2]);
      var content;
      if (pendingDel === r.id) {
        content = '<span class="ask">지울까요?</span>' +
          '<button type="button" class="ask-btn yes" data-act="del-yes" data-id="' + esc(r.id) + '">지우기</button>' +
          '<button type="button" class="ask-btn" data-act="del-no">아니요</button>';
      } else {
        content = '<span class="tag ' + r.type + '">' + esc(r.cat) + '</span>' + esc(r.memo) +
          ' <button type="button" class="del" data-act="del" data-id="' + esc(r.id) + '" aria-label="' + esc(dateTxt + ' ' + r.cat + ' 기록 지우기') + '">삭제</button>';
      }
      return '<tr><td class="d">' + dateTxt + '</td><td class="c">' + content + '</td>' +
        '<td class="num in-cell">' + (r.type === 'in' ? fmt(r.amt) : '') + '</td>' +
        '<td class="num out-cell">' + (r.type === 'out' ? fmt(r.amt) : '') + '</td>' +
        '<td class="num bal' + (r.bal < 0 ? ' neg' : '') + '">' + fmt(r.bal) + '</td></tr>';
    }).join('');
  }

  function applySkin() {
    var root = document.documentElement;
    if (state.skin === 'green') root.removeAttribute('data-skin');
    else root.setAttribute('data-skin', state.skin);
    var r = $('sk-' + state.skin);
    if (r) r.checked = true;
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', THEME_COLORS[state.skin]);
  }

  function renderAll() {
    applySkin();
    renderDemo(); renderHero(); renderGoal(); renderSummary(); renderLedger();
  }

  /* ---------- form ---------- */
  function curType() { return document.querySelector('input[name="type"]:checked').value; }

  function btnLabel() {
    $('submit').textContent = warned ? '맞아요, 기록하기' : (curType() === 'in' ? '받은 돈 기록하기' : '쓴 돈 기록하기');
  }

  function renderCats() {
    var t = curType();
    var prev = document.querySelector('input[name="cat"]:checked');
    var prevVal = prev ? prev.value : null;
    var box = $('cats');
    box.innerHTML = CATS[t].map(function (c, i) {
      return '<input class="sr" type="radio" name="cat" id="cat-' + i + '" value="' + c + '"' + (c === prevVal ? ' checked' : '') + '>' +
        '<label for="cat-' + i + '">' + c + '</label>';
    }).join('');
    if (!box.querySelector('input:checked')) box.querySelector('input').checked = true;
    $('catLab').textContent = t === 'in' ? '어떤 돈을 받았나요?' : '무엇에 썼나요?';
    $('memo').placeholder = t === 'in' ? '예: 이번 주 용돈' : '예: 편의점 젤리';
    btnLabel();
  }

  function say(text, kind) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg ' + (kind || '');
    clearTimeout(msgTimer);
    if (kind === 'ok') msgTimer = setTimeout(function () { m.textContent = ''; m.className = 'msg'; }, 3500);
  }

  function bindMoney(el) {
    el.addEventListener('input', function () {
      var n = el.value.replace(/\D/g, '').slice(0, 8);
      el.value = n ? fmt(Number(n)) : '';
    });
  }
  function moneyVal(el) { return Number(el.value.replace(/\D/g, '')) || 0; }

  function resetWarn() {
    if (warned) { warned = false; btnLabel(); }
    if ($('msg').className.indexOf('warn') > -1 || $('msg').className.indexOf('err') > -1) say('');
  }

  function onSubmit(ev) {
    ev.preventDefault();
    var type = curType();
    var catEl = document.querySelector('input[name="cat"]:checked');
    var cat = catEl ? catEl.value : '기타';
    var amt = moneyVal($('amt'));
    var date = $('date').value;
    var memo = $('memo').value.trim().slice(0, 30);
    if (amt < 1) { say('금액을 1원 이상 적어 주세요.', 'err'); $('amt').focus(); return; }
    if (!date || date > todayStr) { say('날짜는 오늘이거나 지난 날짜로 골라 주세요.', 'err'); $('date').focus(); return; }
    if (state.entries.length >= MAX_ENTRIES) { say('기록이 너무 많아요. 오래된 기록을 지워 주세요.', 'err'); return; }
    var bal = balance();
    if (type === 'out' && amt > bal && !warned) {
      warned = true; btnLabel();
      say('가진 돈(' + fmt(Math.max(bal, 0)) + '원)보다 많아요. 금액이 맞으면 한 번 더 눌러 주세요.', 'warn');
      return;
    }
    state.entries.push({ id: uid(), date: date, type: type, cat: cat, memo: memo, amt: amt, ts: Date.now(), demo: false });
    persist();
    warned = false;
    $('amt').value = '';
    $('memo').value = '';
    $('date').value = todayStr;
    btnLabel();
    say(type === 'in' ? '받은 돈을 기록했어요.' : '쓴 돈을 기록했어요.', 'ok');
    renderAll();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var add = ev.target.closest('[data-add]');
    if (add) {
      var n = Number(add.getAttribute('data-add'));
      var cur = moneyVal($('amt'));
      var next = n === 0 ? 0 : Math.min(cur + n, MAX_AMT);
      $('amt').value = next ? fmt(next) : '';
      resetWarn();
      return;
    }
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    if (act === 'del') { pendingDel = id; renderLedger(); }
    else if (act === 'del-no') { pendingDel = null; renderLedger(); }
    else if (act === 'del-yes') {
      state.entries = state.entries.filter(function (e) { return e.id !== id; });
      pendingDel = null; persist(); renderAll();
    }
    else if (act === 'more') { shown += 30; renderLedger(); }
    else if (act === 'clear-demo') {
      state.entries = state.entries.filter(function (e) { return !e.demo; });
      if (state.goal && state.goal.demo) state.goal = null;
      persist(); renderAll();
    }
    else if (act === 'goal-edit') { openGoalForm(); }
    else if (act === 'goal-cancel') { goalEditing = false; renderGoal(); }
    else if (act === 'goal-delete') { state.goal = null; goalEditing = false; persist(); renderAll(); }
    else if (act === 'goal-save') {
      var name = $('goalName').value.trim().slice(0, 14);
      var amt = moneyVal($('goalAmt'));
      var m = $('goalMsg');
      if (!name) { m.textContent = '사고 싶은 것의 이름을 적어 주세요.'; m.className = 'msg err'; $('goalName').focus(); return; }
      if (amt < 1) { m.textContent = '가격을 1원 이상 적어 주세요.'; m.className = 'msg err'; $('goalAmt').focus(); return; }
      state.goal = { name: name, amt: amt, demo: false };
      goalEditing = false; persist(); renderAll();
    }
  });

  var form = $('form');
  form.addEventListener('submit', onSubmit);
  form.addEventListener('input', resetWarn);
  document.querySelector('.skins').addEventListener('change', function (ev) {
    if (ev.target.name !== 'skin') return;
    state.skin = ev.target.value;
    applySkin();
    persist();
  });
  form.addEventListener('change', function (ev) {
    if (ev.target.name === 'type') renderCats();
    resetWarn();
  });
  bindMoney($('amt'));

  /* ---------- start ---------- */
  $('todayLabel').textContent = (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + WEEK[now.getDay()] + '요일';
  $('date').value = todayStr;
  $('date').max = todayStr;
  renderCats();
  renderAll();
  setStatus();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
